<script>
(function () {
    var MAP_W = 1000;
    var legend = document.querySelector('details.map-legend');
    if (!legend) return;
    var touched = false;

    // Reader ownership is detected from an actual gesture, NOT from the
    // `toggle` event. `toggle` also fires for programmatic changes, and Chrome
    // queues one for a <details open> element that lands AFTER this script
    // attaches its listener; on a wide load `fit()` returns early, so that
    // stray event set `touched` for good and disabled the breakpoint
    // (2026-09-21: the legend then covered four of New York's labels in a
    // window narrowed after loading). A click on the <summary> is
    // unambiguous, and keyboard activation dispatches a click too.
    var summary = legend.querySelector('summary');
    if (summary) {
        summary.addEventListener('click', function () { touched = true; });
    }

    function fit() {
        if (touched) return;
        var narrow = (document.documentElement.clientWidth || window.innerWidth) < MAP_W;
        if (narrow !== !legend.open) legend.open = !narrow;
    }
    fit();
    // Second pass: the 1000px map forces scrollbars at load, so the first
    // measurement can read ~15px short; once PHONE_FIT_SCRIPT has resized the
    // container they are gone and the width is accurate.
    requestAnimationFrame(fit);
    window.addEventListener('resize', fit);

    // THE CREDIT LINE'S HEIGHT. The inline bottom offset clears a ONE-line
    // credit (ONE_LINE, 14 px measured 2026-10-13; re-measure if the
    // attribution's font size changes). The line wraps to two at phone width
    // when it is long: the standard layer's "Heatmap and overlays" credit at
    // 375 px (measured 2026-10-16: 28 px, legend 14 px short), and the search
    // index credit after a search. So the legend is raised by whatever the
    // line grew, re-measured whenever the line changes size (a base layer
    // switch, the search credit, a resize). The inline offset stays the
    // base, so check K of check_provenance.py still reads it.
    var ONE_LINE = 14;
    var base = legend.style.bottom;
    function creditFit(att) {
        var grew = Math.max(0, Math.round(att.offsetHeight) - ONE_LINE);
        legend.style.bottom = grew ? 'calc(' + base + ' + ' + grew + 'px)' : base;
    }
    // The credit element seen at load is not always the one that stays, so
    // the corner that holds it is watched and the observer re-bound to
    // whichever credit element is current.
    var bound = null, ro = window.ResizeObserver ? new ResizeObserver(refit) : null;
    function refit() {
        var att = document.querySelector('.leaflet-control-attribution');
        if (!att) return;
        if (att !== bound) {
            if (ro) { if (bound) ro.unobserve(bound); ro.observe(att); }
            bound = att;
        }
        creditFit(att);
    }
    function watchCredit() {
        var corner = document.querySelector('.leaflet-bottom.leaflet-right');
        // setTimeout, not requestAnimationFrame: a hidden tab runs no frames.
        if (!corner) { setTimeout(watchCredit, 50); return; }
        new MutationObserver(refit).observe(corner, {childList: true, subtree: true, characterData: true});
        window.addEventListener('resize', refit);
        refit();
        // The line also wraps when PHONE_FIT_SCRIPT narrows the container,
        // which no mutation reports, and a hidden tab runs no ResizeObserver.
        setTimeout(refit, 500);
        setTimeout(refit, 1500);
    }
    watchCredit();
})();

(function () {
    var KEY = 'expanded-heatmap-theme';
    var btn = document.getElementById('theme-toggle');
    function saved() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
    function save(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }
    function apply(dark) {
        document.body.classList.toggle('dark-base', dark);
        btn.setAttribute('aria-pressed', dark ? 'true' : 'false');
        btn.textContent = dark ? '\u2600 Light mode' : '\u263E Dark mode';

        // the open legend's clearance is re-measured on every switch (review

        // first call comes before `actions` is set; the load path measures then.

    function ambientPrefersDark() {
        try {
            if (window.parent !== window) {
                var bg = window.parent.getComputedStyle(
                    window.parent.document.body).backgroundColor;
                var n = bg && bg.match(/[\d.]+/g);
                if (n && n.length >= 3) {
                    var alpha = n.length > 3 ? parseFloat(n[3]) : 1;
                    if (alpha > 0.1) {          // transparent tells us nothing

    // embedded in a dark app page does not open as a white rectangle.
    var choice = saved();
